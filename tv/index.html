<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Havnevik Kontorskjerm</title>
<style>html, body { margin: 0; height: 100%; background: #0b161d; }</style>
</head>
<body>
<script>
// Laster: henter alltid siste app.html fra GitHub, så endringer vises innen få minutter
var SRC = "https://raw.githubusercontent.com/markus541/lunch/main/tv/app.html";
function load() {
  fetch(SRC + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { setTimeout(load, 30000); });
}
load();
</script>
</body>
</html>
